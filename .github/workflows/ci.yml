# The slow half of the quality gate (PROJECT_RULES §6).
#
# Pre-commit (M1-T07) runs the fast checks on every commit and deliberately
# refuses the slow ones. This is where they run: the characterization golden,
# which is the single precondition for M2, plus the lint and type baselines the
# hooks skip on `src/`.
name: CI

on:
  push:
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # `uv run` syncs the project environment before running unless told not
      # to — which would install the full runtime, torch and all, and undo the
      # `--only-group ci` install below. Job-level so it cannot be forgotten on
      # a step added later.
      UV_NO_SYNC: "1"

    steps:
      # Pinned to exact releases. `astral-sh/setup-uv` publishes no floating
      # major tag — `@v9` does not resolve — and an exact pin means CI cannot
      # change underneath a run anyway.
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # 3.12 explicitly, not from `.python-version`. `requires-python = ">=3.12"`
      # lets uv pick the newest interpreter it can find, and on the runner that
      # was 3.14 — which the golden noticed before anyone else did (M1-T08): it
      # records exception *messages*, and CPython 3.14 reworded
      # "too many values to unpack". A characterization baseline is only
      # comparable within the interpreter that produced it.
      - name: Install Python
        run: uv python install 3.12

      # `--only-group ci` on purpose. A plain `uv sync` resolves torch from the
      # CUDA 11.8 index and clones SAM2 from GitHub — hundreds of megabytes for
      # code the suite never imports (every heavy import in `src/` is
      # function-local; verified in M1-T08). `--locked` fails if uv.lock is stale
      # rather than quietly resolving something else, which matters because the
      # golden is sensitive to numpy/scipy/scikit-image versions.
      - name: Install the CI environment
        run: uv sync --python 3.12 --only-group ci --locked

      # Proof, not assumption. Both halves have already caught something: a CUDA
      # wheel would make the job wrong even when green, and the interpreter
      # version silently drifted to 3.14 on the first real run.
      - name: Assert the environment matches the golden
        run: |
          uv run python - <<'PY'
          import importlib.util as u
          import sys

          assert sys.version_info[:2] == (3, 12), (
              f"CI is on Python {sys.version.split()[0]}. The characterization golden "
              "records CPython exception messages, which are not stable across minor "
              "versions — compare it only on the interpreter that produced it."
          )
          heavy = [m for m in ("torch", "ultralytics", "sam2", "patched_yolo_infer")
                   if u.find_spec(m) is not None]
          assert not heavy, f"CI installed packages the suite does not need: {heavy}"
          print(f"Python {sys.version.split()[0]}, CPU-only: none of torch/ultralytics/sam2")
          PY

      # ── blocking: the code we own ────────────────────────────────────────────
      # Every check below runs a Makefile target, never its own copy of the
      # command (M1-T10). `make check` locally and this job are then the same
      # gate by construction; the alternative is what nearly happened in M1-T08,
      # one exclusion declared in two files.
      #
      # `src/` is excluded by `[tool.ruff] extend-exclude` + `force-exclude`,
      # declared once in pyproject.toml and shared with pre-commit. Everything
      # else must be clean.
      #
      # The steps stay separate rather than one `make check` so a red job names
      # the stage in the UI without anyone opening a log.
      - name: Format
        run: make format

      - name: Lint
        run: make lint

      # ── blocking: tests, including the golden ────────────────────────────────
      # ~200 s. This is the check M2 depends on: sixteen relocation tasks, each of
      # which must prove it moved no number, on a machine that is not the
      # author's. `tee` lives here, not in the target: it exists for the failure
      # report below, which is a CI concern.
      - name: Tests and characterization golden
        run: |
          set -o pipefail
          make test 2>&1 | tee pytest.log

      # A red job that says only "exit code 1" teaches people to stop reading CI,
      # and the job log needs admin rights to fetch. Annotations and the run
      # summary do not, so the failure goes where anyone can see it — including
      # whoever is looking at the pull request rather than the Actions tab.
      - name: Report the failure where it can be read
        if: failure() && hashFiles('pytest.log') != ''
        run: |
          {
            echo '## pytest failed'
            echo '```'
            tail -60 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(FAILED|ERROR|E  )" pytest.log | head -20 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      # ── reported, not blocking: the legacy core ──────────────────────────────
      # The posture from M1-T04 and M1-T07: `src/` is checked and never silenced,
      # but it does not block, because 109 ruff findings and 21 mypy errors would
      # freeze all sixteen M2 tasks. The numbers are published so a regression is
      # visible in review. M2-T01 points mypy at `nanoscope/`, where the check is
      # strict and blocking from the first line.
      - name: Legacy baseline (report only)
        if: always()
        continue-on-error: true
        run: |
          {
            echo '## Legacy baseline — `src/`, reported not blocking'
            echo
            echo '### ruff'
            echo '```'
            make lint-legacy 2>&1 | tail -30
            echo '```'
            echo '### mypy'
            echo '```'
            make types 2>&1 | tail -30
            echo '```'
            echo '> Expected on a clean run: 109 ruff findings, 21 mypy errors.'
            echo '> 21, not the 22 measured locally — mypy infers less when'
            echo '> `ultralytics` is absent, which it is here by design (M1-T08).'
          } >> "$GITHUB_STEP_SUMMARY"
