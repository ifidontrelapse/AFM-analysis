# Pre-commit hooks — the fast half of the quality gate (PROJECT_RULES §6).
#
# Install once per clone; a fresh clone has no hooks until you do:
#
#     uv run pre-commit install
#
# What is deliberately NOT here: pytest and mypy. The characterization golden
# alone takes 200 s, and a hook that slow is a hook people bypass with
# `--no-verify`. A gate that gets routed around is worse than no gate, so the
# slow checks belong in CI (M1-T08). Everything below runs in about a second.

# A hook must never edit the golden file. This one exclusion is global.
exclude: '^tests/characterization/golden/'

# --- no exclusions -----------------------------------------------------------
#
# From M1-T07 until M2-T15 the rewriting hooks skipped `^src/`. The reason was not
# taste: that directory held 109 ruff findings, so a blocking hook would have made
# every commit touching the scientific core impossible for the sixteen tasks M2
# took, and PROJECT_RULES §4.1 forbids rewriting the science to make the
# architecture prettier — a stray whitespace trim inside a relocation commit is
# noise in the one diff that has to read as a pure move.
#
# `src/` is deleted. Every hook now applies to every file. The posture that
# produced the exclusion still holds, and M2 honoured it a different way: each
# moved module was formatted in a commit that also proved its AST unchanged.
#
# What is left of the old carve-out lives in `pyproject.toml` as a short list of
# per-file ignores, each naming the task that deletes it. `make lint-legacy`
# prints what they hide.

repos:
  # ── ruff — the project's own installed version, not a mirror ───────────────
  #
  # `repo: local` on purpose. The usual `astral-sh/ruff-pre-commit` mirror
  # declares a second ruff version in a second file, and the two drift silently
  # until local and CI disagree about what is a finding. Here `pyproject.toml`
  # is the only place a version is stated. The price is that hooks need `uv` on
  # PATH, which this project requires anyway (docs/Development.md §1).
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      # Check only — never `--fix`. Formatting is not an opinion (PROJECT_RULES
      # §3: `ruff format` decides), but a lint autofix rewrites logic, and
      # M1-T03 removed `fix = true` precisely so that asking ruff a question
      # cannot edit the scientific core as a side effect.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --no-fix
        language: system
        types_or: [python, pyi]

  # ── hygiene ───────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # M1-T01 removed a 26 MB checkpoint from the index with hours to spare
      # before it was permanent. This is the hook that would have refused it.
      - id: check-added-large-files
        args: [--maxkb=1024]
      # These two rewrite. They used to skip the scientific core; since M2-T15
      # there is nothing to skip.
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml

  # ── notebooks are experiments, not interfaces (PROJECT_RULES §7) ───────────
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
