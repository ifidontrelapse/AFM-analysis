[project]
# `afm-analysis` until M2-T01. AFM is one of three modalities the code already
# supports; the name is the product's, not one modality's (ADR-0011).
name = "nanoscope"
version = "0.1.0"
description = "Desktop analysis of nanoparticle microscopy images (AFM, SEM, TEM)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "ipympl>=0.10.0",
    "matplotlib>=3.10.8",
    "numpy>=2.2.0,<3.0",
    "opencv-python>=4.10.0",
    "pandas>=2.2.0",
    "patched-yolo-infer>=1.3.10",
    "pyspm>=0.6.3",
    "requests>=2.32.5",
    "sam-2",
    "sam2>=1.1.0",
    "scikit-image>=0.24.0",
    "torch",
    "torchvision",
    "tqdm>=4.67.3",
    "ultralytics>=8.4.41",
]

# Development tooling — the quality gate (PROJECT_RULES §6, ADR-0009).
# Configuration for these lives in [tool.ruff] and [tool.mypy]; M1-T03 and
# M1-T04 repair it. This group only makes the tools exist.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.14",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

# The CI environment (M1-T08) — deliberately smaller than the runtime one.
#
# Nothing in `src/` imports torch, ultralytics, sam2 or patched_yolo_infer at
# module level; those are function-local (verified by import trace, M1-T08), and
# the tests never reach them. So CI has no reason to resolve the CUDA 11.8 wheel
# or clone SAM2 from GitHub — minutes of download for code the suite does not
# execute. `uv sync --only-group ci` installs this and nothing else.
#
# Versions are not repeated here on purpose: uv resolves every group against one
# lock, so these are the same versions `dev` gets. One source of truth, as with
# ruff in `.pre-commit-config.yaml`.
ci = [
    "numpy",
    "scipy",
    "scikit-image",
    "pandas",
    "matplotlib",
    # `opencv-python` needs libGL, which a headless runner does not have. The
    # headless build ships the same `cv2` module without the system dependency.
    "opencv-python-headless",
    { include-group = "dev" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
sam-2 = { git = "https://github.com/facebookresearch/sam2.git" }

[tool.pytest.ini_options]
# M1-T05 folded `pytest.ini` in here and deleted it. Two configuration files is a
# trap: while `pytest.ini` exists pytest ignores `[tool.pytest.ini_options]`
# entirely, so anything written here would have been silently dead.

# `src/` is not an installed package yet. M2-T14 replaces this with an editable
# install and deletes the line.
pythonpath = [".", "src"]

markers = [
    'slow: minutes, not milliseconds. The characterization golden (~100 s) carries it. `pytest -m "not slow"` skips it for inner-loop work; the full run is the merge gate.',
]

[tool.mypy]
python_version = "3.12"
# Both, for as long as both exist: `nanoscope` is strict and blocking (the
# override below), `src` is reported and never silenced. `src` goes at M2-T15.
files = ["src", "nanoscope"]
show_error_codes = true
# `pretty` is not set here: the Makefile's `types` target passes `--no-pretty`
# (M1-T10), so a value here would be dead configuration contradicted by the flag.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# `src/` posture (M1-T04): checked at default strictness and NOT silenced.
# It reports 22 errors today, 13 of which are static confirmations of audit
# defects — D-01, D-02, D-07, D-10, D-16 — so `ignore_errors` here would throw
# away the most valuable output this tool has produced. The package is deleted
# in M2-T15; until then the baseline is documented in docs/Progress.md and CI
# reports it without blocking (M1-T08).

# New code is strict from its first line — retrofitting is far more expensive.
[[tool.mypy.overrides]]
module = "nanoscope.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true

# The moved scientific core (M2-T03 onwards). `nanoscope.*` is strict; code that
# arrives verbatim from `src/` under the characterization golden cannot be, and the
# alternative — a `type: ignore` on every defect the audit already lists — buries
# the real errors in noise and has to be unpicked in M3 anyway.
#
# This is not silencing: mypy still checks these modules at its default strictness,
# exactly as it checks `src/` today, and CI publishes the count. It is the M1-T04
# posture applied to code in transit. Delete this block when M3 closes; the strict
# settings above then apply to the science too, which is the point of moving it.
[[tool.mypy.overrides]]
module = "nanoscope.core.science.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

# Third-party packages that ship neither stubs nor a py.typed marker. Scoped
# per module on purpose: a blanket `ignore_missing_imports` would also hide a
# typo in a first-party import.
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "scipy.*",
    "patched_yolo_infer.*",
    "ultralytics.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"        # the project requires >=3.12; UP rules follow this
line-length = 100
indent-width = 4

# No `fix = true` here on purpose. `ruff check` must answer a question, not
# rewrite the scientific core as a side effect of being asked. Fix explicitly:
#     ruff check --fix

exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    # Notebooks are experiments, not interfaces (PROJECT_RULES §7). Linting them
    # produces 68 findings about import order and prints in exploratory cells,
    # which drowns the library signal. Notebook hygiene is M1-T09.
    "*.ipynb",
    # Ruff formats Python inside Markdown code blocks. Documentation snippets
    # are illustrations, not source: `Architecture.md` sketches a Protocol with
    # `...` bodies and aligns a registry call for reading. A formatter must not
    # be authoritative over prose examples — PROJECT_RULES §3 is about source.
    # Found by M1-T08: `ruff format --check .` failed on three .md files.
    "*.md",
]

# The legacy core, excluded from the blocking checks (M1-T07, M1-T08).
#
# `ruff check .` and `ruff format --check .` are what pre-commit and CI run, and
# they must mean "the code we own is clean". `src/` has 109 open findings;
# blocking on them would make every M2 commit impossible, and rewriting the
# science to satisfy a formatter is forbidden by PROJECT_RULES §4.1. Same
# posture mypy takes (M1-T04): reported, not silenced.
#
# `force-exclude` extends that to paths named explicitly on the command line,
# which is what pre-commit passes. To measure the legacy baseline anyway:
#
#     ruff check src --no-fix --no-force-exclude
#
# One path, not a list: `preprocess_batch.py` was the second entry and was
# deleted in ADR-0012. M2 moves `src/` to `nanoscope/`, where it arrives clean,
# and M2-T15 deletes this line.
extend-exclude = ["src"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "A",   # builtins
    "C4",  # comprehensions
    "DTZ", # datetime
    "SIM", # simplify
    "PIE", # misc
    "T20", # print
    "RET", # return
    "RUF", # Ruff-specific
]

ignore = [
    "E501",   # line length — owned by the formatter
    "B008",   # function calls in argument defaults — normal for numpy/scipy
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint.isort]
# `src` stays alongside until M2-T15 deletes the shim; both are ours.
known-first-party = ["nanoscope", "src"]
combine-as-imports = true

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]

[tool.ruff.lint.per-file-ignores]
# Test scripts print by design. `S101` (assert) was listed here, but the `S`
# rule family is not selected — dead configuration, removed. See backlog B-056.
"tests/*" = ["T20"]

# The moved scientific core (M2-T03 onwards), where `ruff check` **is** blocking —
# unlike `src/`, which is excluded wholesale. Three rules, each with the task that
# deletes the entry. Everything else (E, F, B, UP, SIM, …) blocks here as normal,
# which is the difference between this and the `src` carve-out.
"nanoscope/core/science/*" = [
    "RUF001", "RUF002", "RUF003",  # Russian text — M2-T12 translates it, D-22
    "T201",                        # print in library code — M2-T11 adds a log sink, D-23
    "RUF013",                      # implicit Optional — a real defect signature, M3
    "RET504",                      # `x = ...; return x` — cosmetic, and rewriting
                                   # science for a style rule is PROJECT_RULES §4.1
    "N806",                        # a local `HEADER_READ_BYTES` — cosmetic, M3 when it
                                   # touches the parser anyway
    "SIM108",                      # if/else → ternary — cosmetic
    "RUF046",                      # "int() around an already-int". **Not cosmetic:**
                                   # `round(np.float64)` returns np.float64, so dropping
                                   # the `int()` in measure_all_baseline would change the
                                   # dtype of the x_px/y_px DataFrame columns. Ruff is
                                   # reasoning about builtins; this code is fed numpy
                                   # scalars. Left exactly as it is.
]
# Legacy that landed in an adapter rather than in the science tree (M2-T04). Same
# status, same expiry: M2-T12 translates the docstring and this entry goes.
"nanoscope/infrastructure/storage/loaders.py" = ["RUF002"]
