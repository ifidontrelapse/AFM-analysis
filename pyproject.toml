[project]
name = "afm-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "ipympl>=0.10.0",
    "matplotlib>=3.10.8",
    "numpy>=2.2.0,<3.0",
    "opencv-python>=4.10.0",
    "pandas>=2.2.0",
    "patched-yolo-infer>=1.3.10",
    "pyspm>=0.6.3",
    "requests>=2.32.5",
    "sam-2",
    "sam2>=1.1.0",
    "scikit-image>=0.24.0",
    "torch",
    "torchvision",
    "tqdm>=4.67.3",
    "ultralytics>=8.4.41",
]

# Development tooling — the quality gate (PROJECT_RULES §6, ADR-0009).
# Configuration for these lives in [tool.ruff] and [tool.mypy]; M1-T03 and
# M1-T04 repair it. This group only makes the tools exist.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.14",
    "mypy>=1.14",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
sam-2 = { git = "https://github.com/facebookresearch/sam2.git" }

[tool.ruff]
target-version = "py312"        # the project requires >=3.12; UP rules follow this
line-length = 100
indent-width = 4

# No `fix = true` here on purpose. `ruff check` must answer a question, not
# rewrite the scientific core as a side effect of being asked. Fix explicitly:
#     ruff check --fix

exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    # Notebooks are experiments, not interfaces (PROJECT_RULES §7). Linting them
    # produces 68 findings about import order and prints in exploratory cells,
    # which drowns the library signal. Notebook hygiene is M1-T09.
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "A",   # builtins
    "C4",  # comprehensions
    "DTZ", # datetime
    "SIM", # simplify
    "PIE", # misc
    "T20", # print
    "RET", # return
    "RUF", # Ruff-specific
]

ignore = [
    "E501",   # line length — owned by the formatter
    "B008",   # function calls in argument defaults — normal for numpy/scipy
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint.isort]
# Becomes the real package name in M2-T01 (ADR-0011).
known-first-party = ["src"]
combine-as-imports = true

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]

[tool.ruff.lint.per-file-ignores]
# Test scripts print by design. `S101` (assert) was listed here, but the `S`
# rule family is not selected — dead configuration, removed. See backlog B-056.
"tests/*" = ["T20"]
